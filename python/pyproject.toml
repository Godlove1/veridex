[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veridex"
version = "0.1.0"
description = "Tamper-evident integrity evidence for existing relational databases"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
evm = ["web3>=7"]  # blockchain anchoring (Anvil, Base); tested with web3 8.0
dev = ["pytest>=8"]

[project.scripts]
veridex = "veridex.cli:main"

[tool.setuptools.packages.find]
include = ["veridex*"]

[tool.setuptools.package-data]
veridex = ["contracts/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
