[profile.default]
src = "src"
out = "out"
cache_path = "cache"
solc = "0.8.30"
# Oldest EVM that every target chain runs, so one bytecode works everywhere.
evm_version = "paris"
optimizer = true
optimizer_runs = 200
# No metadata hash: the runtime bytecode depends only on the source and these
# settings, which lets verifiers check the deployed code hash.
bytecode_hash = "none"
cbor_metadata = false
